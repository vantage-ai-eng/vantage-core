[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage-core"
version = "0.1.15"
description = "RuntimeAI check-ride CLI — portable decision artifact for agent release gates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vantage AI", email = "hello@vantageai.cc" }]
keywords = ["runtimeai", "vantage", "agent-eval", "ci", "check-ride"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
# Default install is runnable (PyPI stranger path).
dependencies = [
  "openai>=1.40.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "cryptography>=42.0",
]

[project.optional-dependencies]
# Alias kept for docs that say pip install "vantage-core[run]"
run = ["openai>=1.40.0", "pyyaml>=6.0", "python-dotenv>=1.0", "cryptography>=42.0"]
dev = ["pytest>=8.0", "build", "twine"]

[project.scripts]
vantage-core = "vantage_core.cli:cli_entry"

[project.urls]
Homepage = "https://www.vantageai.cc/runtimeai/method/cicd"
Documentation = "https://www.vantageai.cc/runtimeai/method/cicd"
Repository = "https://github.com/vantage-ai-eng/vantage-core"
Issues = "https://github.com/vantage-ai-eng/vantage-core/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["vantage_core*"]

[tool.setuptools.package-data]
vantage_core = [
  "py.typed",
  "schemas/*.json",
  "fixtures/*",
  "data/*.json",
  "keys/*.json",
  "starters/*.yaml",
  "samples/*.yaml",
  "samples/*.md",
  "samples/*.json",
  "samples/*.pdf",
  "demo_fixtures/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
